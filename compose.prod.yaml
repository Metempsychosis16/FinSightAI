services:
  backend:
    image: finsight-backend:prod
    container_name: finsight-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      PORT: 3000
      RUST_LOG: info,tower_http=info
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:3000/health/database
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - finsight-network

  frontend:
    image: finsight-frontend:prod
    container_name: finsight-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - finsight-network

networks:
  finsight-network:
    driver: bridge
